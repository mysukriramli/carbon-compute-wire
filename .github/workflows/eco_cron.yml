name: Eco-Compute Radar Cron

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Run Eco-Compute Cross-Reference
        run: |
          python3 ingest_eco_compute.py

      - name: Commit and push updates
        run: |
          git config user.name "eco-wire-bot[bot]"
          git config user.email "eco-wire-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No market shifts detected. Skipping commit."
          else
            git commit -m "chore(routing): publish live eco-compute directives [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
